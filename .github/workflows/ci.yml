name: CI

on:
  pull_request:
  push:
    branches: [master]
  # The test and mutation jobs run ONLY from here while tests are paused (see those
  # jobs): Actions → CI → Run workflow.
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux-first: the macOS and Windows jobs are intentionally DISABLED while development
# focuses on Linux (darwin/windows native code is kept as stubs). Restore them from git
# history (this file before the "Linux-first CI" change) when cross-platform CI is wanted
# again. The Odin toolchain is pinned in .odin-version and installed by
# .github/actions/setup-odin; bump it there, in its own PR with `make sdk-diff`.

jobs:
  # Which step groups this run needs (scripts/ci-scope.mjs): `docs` runs only
  # the lints, `tooling` adds the JS checks and the changed-only mutation gate,
  # `code` runs everything with the changed-only mutation gate, and `full`
  # (push to master, manual runs) runs everything including the whole mutation
  # manifest. Master's full run is the safety net for whatever a PR skipped.
  #
  # The job layout follows Node's and Bun's CI: cheap checks, the build-and-test job
  # and the mutation gate run as separate jobs side by side instead of one after the
  # other, and the mutation gate — the long pole — is sharded across three runners
  # (run-mutations.mjs --shard, which keeps each gate's baseline in one shard).
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # Full history: the scope step diffs against the PR base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scope
        id: scope
        run: node scripts/ci-scope.mjs ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }} >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (type-check, format, lint)
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        if: needs.scope.outputs.scope != 'docs'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev libbrotli-dev libzstd-dev zlib1g-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Bun runs the JS gates (`bun fmt`, `bun run js:*`) and installs the dev
      # dependencies. The version comes from package.json's packageManager so CI
      # formats with the same Bun as `make check-js` does locally.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dev dependencies
        run: bun install --frozen-lockfile

      - name: Setup Odin
        if: needs.scope.outputs.scope != 'docs'
        uses: ./.github/actions/setup-odin
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Type-check
        if: needs.scope.outputs.scope == 'code' || needs.scope.outputs.scope == 'full'
        run: make check

      # `make fmt` once exited non-zero for every caller (a strip-semicolon
      # parse failure, fixed by -collection:lava=.) and nothing noticed, because
      # no CI step ran it. This pins both that fmt runs and that the tree is
      # already formatted: fmt rewrites in place, so any diff is a formatting
      # violation (or a fmt regression).
      - name: Format (Odin)
        if: needs.scope.outputs.scope == 'code' || needs.scope.outputs.scope == 'full'
        run: make fmt && git diff --exit-code

      - name: JavaScript lint and format
        if: needs.scope.outputs.scope != 'docs'
        run: make check-js

      # The Window-profile oracle (tests/web): every case under `lava run --surface=web`
      # against its committed Chrome recording. Here and not in the test job because
      # that job is paused and this suite is the gate the Node-profile removal stages
      # merge on; it needs only what this job already installs (JSC, Odin, node), and
      # the build plus the run is ~30 s (Build was 23 s in the test job's last manual
      # run, the suite 4 s locally for 45 cases). No Chrome: recording is local.
      - name: Web oracle (Chrome recordings)
        if: needs.scope.outputs.scope == 'code' || needs.scope.outputs.scope == 'full'
        run: make test-web

      - name: Markdown lint
        run: make check-md

      - name: Workflow lint
        run: make check-actions

  test:
    name: Linux (full build + tests)
    needs: scope
    # PAUSED (owner's call, 2026-11-18): the Node-only modules are out of the default
    # build (LAVA_NODE_MODULES) while the engine core is built, and the suites are not
    # run until that work is done. Manual runs only; drop the event check to resume.
    if: github.event_name == 'workflow_dispatch' && (needs.scope.outputs.scope == 'code' || needs.scope.outputs.scope == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev libbrotli-dev libzstd-dev zlib1g-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Bun runs the JS gates (`bun fmt`, `bun run js:*`) and installs the dev
      # dependencies. The version comes from package.json's packageManager so CI
      # formats with the same Bun as `make check-js` does locally.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dev dependencies
        run: bun install --frozen-lockfile

      - name: Setup Odin
        uses: ./.github/actions/setup-odin
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Differential property tests: fast-check generates the corpus and both
      # runtimes answer it in one process pair per property. It was out of CI when
      # it spawned a pair per input (64s for 200 inputs); batched it is ~1s for
      # 5000, and at that size it found a real utf-16le divergence the hand-picked
      # oracle cases missed.
      - name: Test (differential property suite)
        run: make test-property

      # Runs AFTER build, deliberately: it spawns bin/lava through a parent-held
      # non-blocking pipe, which is the only way to reproduce the truncation it pins
      # (the O_NONBLOCK flag has to come from the parent). It lived under scripts/ at
      # first, which put it in the buildless check-js step and made it fail on a fresh
      # checkout for want of a binary.
      - name: Test (stdio writer)
        run: make test-stdio

      - name: Test (Lava behavior)
        run: make test-lava

      # The same oracle suites with LAVA_HOSTFN_DISABLE=1, which forces every native
      # onto the public-C-API fallback instead of JSC's private host-call ABI. Half of
      # a documented fallback had been running nowhere since the macOS/Windows jobs
      # were disabled, and it is the path a JSC upgrade renaming the dlsym'd mangled
      # symbol drops the whole runtime onto.
      - name: Test (Lava behavior, C-API fallback)
        run: make test-lava-nohostfn

      # The Odin runner gives each test its own thread by default; on one thread the
      # eval call sites share the thread-local host-native registry and JSC's recycled
      # context addresses. That sharing is the shape of two already-fixed defects, and
      # nothing else in CI produces it. Also the only run of the page runner's 10k-page
      # /proc/self/fd census (#4), which is most of its ~75s.
      - name: Test (Odin, single runner thread)
        run: make test-odin-serial

      # Real socket transport: start a Node origin and require lava's fetch output
      # to match Node's, over http://, https:// (TLS), and IPv6 loopback. Excluded
      # from `make test` because it binds a local port; runs here as its own gate.
      - name: Fetch transport smoke
        run: make test-fetch-smoke

      # node:net TCP server: run the echo-server fixture under Node and under Lava,
      # hit each with the same Node client, and require identical client output
      # (server parity). Binds a local port, so it is its own gate like fetch smoke.
      - name: Net server smoke
        run: make test-net-smoke

      # node:http server: run the echo HTTP server fixture under Node and under Lava,
      # hit each with the same Node http client, and require identical deterministic
      # response fields (server parity). Binds a local port — its own gate.
      - name: HTTP server smoke
        run: make test-http-smoke

      # node:https server: a self-signed cert is generated, the Lava HTTPS server is hit by
      # Lava's own TLS client (fetch) over both backends (proactor + readiness), and the
      # synchronous cert/option error cases are asserted. Binds a local port — its own gate.
      - name: HTTPS server smoke
        run: make test-https-smoke

      # Multi-core workers (Slice 3a): N workers share a port via SO_REUSEPORT, load distributes,
      # listen(0) is rejected, SIGTERM drains gracefully. Binds a local port — its own gate.
      - name: Multi-core workers smoke
        run: make test-multicore-smoke

      # MSG_ZEROCOPY (Slice 3b): a large body served via SEND_ZC must arrive byte-exact (the two-CQE
      # buffer-lifetime guard against a kernel-side UAF). Binds a local port — its own gate.
      - name: Zerocopy send smoke
        run: make test-zerocopy-smoke

      # bench/pages is report-only, so this is the only place it runs: a small valid run
      # must report no failed page, and a budget-0 run must exit 1 with every page
      # counted failed — a refused page is never timed as a start-up again (#26 made it so).
      - name: Pages bench smoke
        run: make test-bench-pages-smoke

      # Benchmarks: enforce the per-benchmark lava/node ratio caps in
      # bench/thresholds.json (median of 3 launches per side via --gate, #362).
      - name: Benchmark gate
        run: make bench-gate

  # MUTATION GATE. Breaks the code each recorded test claims to pin and requires
  # the test to go red. It exists because three tests in #321 passed for the
  # wrong reason and every one was caught only by doing this by hand: an oracle
  # case that threw inside its own setup and so printed identical output on both
  # runtimes, a property suite that compared zero inputs after a NaN run count,
  # and an event-loop test whose timer gave platform_poll a positive timeout —
  # which counts as progress by itself, so the no-progress tick under test never
  # happened.
  #
  # A pull request runs only the recorded mutations its diff can affect (CHANGED=1;
  # the runner widens to the whole manifest when its own machinery changed). Every
  # push to master runs the full manifest — the safety net for whatever a PR skipped.
  mutation:
    name: Mutation gate (${{ matrix.shard }}/3)
    needs: scope
    # PAUSED with the test job above; manual runs only.
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Full history: --changed takes its merge-base with origin/master.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install JavaScriptCoreGTK (6.0), SQLite and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-6.0-dev libsqlite3-dev libssl-dev libbrotli-dev libzstd-dev zlib1g-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Bun runs the JS gates (`bun fmt`, `bun run js:*`) and installs the dev
      # dependencies. The version comes from package.json's packageManager so CI
      # formats with the same Bun as `make check-js` does locally.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dev dependencies
        run: bun install --frozen-lockfile

      - name: Setup Odin
        uses: ./.github/actions/setup-odin
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test (mutation gate)
        run: make test-mutation SHARD=${{ matrix.shard }}/3 ${{ needs.scope.outputs.scope != 'full' && 'CHANGED=1' || '' }}
