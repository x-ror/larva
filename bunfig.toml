# `bun fmt` (make check-js / fix-js; markdown via make check-md / fix-md). Replaces
# vite-plus's `vp fmt` (oxfmt); the style is the one the tree was already formatted in:
# oxfmt's 100-column width, semicolons, single quotes. There is no separate JS linter:
# `bun fmt --check` is the style gate, and the correctness checks are the repo's own
# (primordials ratchet, JS module graph, global-replace) plus the oracle suites.
[fmt]
printWidth = 100
semi = true
singleQuote = true
ignorePatterns = [
  "bin/",
  "build/",
  "node_modules/",
  "reports/",
  "tests/vendor/",
  ".deps/",
  # Vendored upstream Node docs: not ours to reformat (markdownlint ignores them too).
  "reference/node-doc-api/",
]
